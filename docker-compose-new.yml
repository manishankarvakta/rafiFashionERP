# Production Docker Compose with Absolute Paths
# Data persists FOREVER at fixed locations, regardless of code changes

services:
  espacio-postgres:
    image: postgres:16-alpine
    container_name: startup-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
      TZ: Asia/Dhaka
    volumes:
      # ABSOLUTE PATH - Data stays here forever
      # Even if you delete entire project directory
      - /var/lib/startup-mvp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

  espacio-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: startup-mvp-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@espacio-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      REDIS_URL: ${REDIS_URL:-redis://espacio-redis:6379}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NODE_ENV: production
    volumes:
      # ABSOLUTE PATH - Local storage for uploaded files persists here
      - /var/lib/startup-mvp/uploads:/app/uploads
    depends_on:
      espacio-postgres:
        condition: service_healthy
    networks:
      - docker-network
      - dokploy-network

  espacio-redis:
    image: redis:7-alpine
    container_name: startup-mvp-redis
    restart: unless-stopped
    volumes:
      # ABSOLUTE PATH - Cache data stays here
      - /var/lib/startup-mvp/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

networks:
  docker-network:
    driver: bridge
  dokploy-network:
    external: true